    ancora: curso
    linha1: "CURSO GRÁTIS NO"
    linha2: "INEMA.CLUB"
    destaque: {titulo: "GRÁTIS", texto: "OSWork\ndo zero"}
    camera: push
    foco: [0.5, 0.5]
    cena: "Mão segurando um smartphone na vertical numa sala clara de dia, com plantas e luz de janela ao fundo desfocado. Na tela do celular, no alto, um vídeo vertical mostrando um notebook com terminal numa mesa; embaixo, a área de comentários com avatares redondos, corações e balões, sem letras legíveis. Tela bem iluminada."
