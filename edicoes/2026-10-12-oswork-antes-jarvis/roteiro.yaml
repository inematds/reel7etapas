    camera: pan_esq
    foco: [0.45, 0.45]
    cena: "Manhã ensolarada em casa. Uma pessoa sorri olhando o celular, que mostra uma conversa com um assistente respondendo; ao lado, o notebook aberto com uma lista de tarefas marcada com checks verdes. Luz do sol dourada entrando pela janela. Clima de tranquilidade."
  - id: comentario
    nome: COMENTÁRIO
