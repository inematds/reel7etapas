palavra: CLIMA
fala: |
  Oitocentos e trinta e dois milímetros de chuva em dois dias. É mais do que chove num ano inteiro em boa parte do sertão. Imagina ter tempo de tirar a sua família de casa antes da água subir. No Japão, o tufão Dujuan deixou sete mortos, e um milhão e novecentas mil pessoas receberam ordem de sair de casa. E o melhor: o aviso existe e é de graça. Cadastra o seu CEP na Defesa Civil e acompanha a chuva num painel em tempo real. Quem recebe o alerta cedo tem tempo de agir. Tá tudo no inema ponto club. Ou comenta CLIMA que eu te mando o link.
# Fatos: JMA via imprensa: 832 mm em 48 h em Oshima, maior desde 1991; Kyodo: 7 mortos, 5 desaparecidos; FDMA: 1,9 milhão sob ordem de evacuação (21–22/09/2026).
