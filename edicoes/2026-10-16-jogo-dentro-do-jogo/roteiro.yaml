fala: |
  Colocaram o Homem-Aranha dentro do Skyrim. O Mario correndo em outro jogo, com os mesmos pulos de sempre. Um portal do Minecraft no meio do GTA: a explosão acontece nos dois jogos. Até um jogo de snowboard antigo do Nintendo sessenta e quatro foi refeito pra rodar no computador. Ninguém teve o código desses jogos. A inteligência artificial olhou como cada um funciona e refez. Isso é o REA, engenharia reversa de qualquer software. E o que vale pra jogo vale pro programa que você paga todo mês. Tá tudo no inema ponto club. Quer o link? Me pede aqui nos comentários.
