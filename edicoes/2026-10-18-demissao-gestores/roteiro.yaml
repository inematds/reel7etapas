# reel7etapas — edição 2026-10-18-demissao-gestores (D9 + D10: medo; tema do Nei 18/10: "demissão em massa de gerentes e executivos que não dominam pessoas, processos e agentes; criei uma formação rápida para executivos"; base: Empresas de 2027 v6.2 — inematds.github.io/empresas-2027-v62, INEMA.CLUB PRO, 9 aulas de ~15 min)
tema: "Demissão em massa de gerentes que não sabem gerir pessoas, processos e agentes"
data: "18/10/2026"
palavra: ME PEDE
letra: tarja
fala: |
  Vem aí uma demissão em massa de gerentes e executivos. Não de todos: dos que não sabem gerir pessoas, processos e agentes ao mesmo tempo. Eu espero que demore, e que não comece em dois mil e vinte e sete. Mas eu conheço muita gente boa que ainda não sabe lidar com um agente de IA, e essas pessoas estão na fila. Por isso eu criei uma formação rápida para executivos, a Empresas de dois mil e vinte e sete. São nove aulas de quinze minutos, sem instalar nada, no chat que você já usa. Você sai sabendo escrever as regras do seu agente e medir o trabalho dele. Tá tudo no inema ponto club. Ou me pede o link aqui nos comentários.
estilo: |
  Fotografia realista cinematográfica, vertical 9:16, com cara de foto real (pele com textura, ambiente de verdade), NÍTIDA. Luz direcional com contraste e sombras (nada chapado), rosto bem iluminado, cores naturais com UMA cor forte de destaque no assunto; sem tom amarelado, sem luz dourada. Emoção clara e forte no rosto ou um objeto-símbolo grande, fácil de entender num celular em meio segundo. COMPOSIÇÃO OBRIGATÓRIA: o assunto principal fica inteiro na faixa central da imagem, entre 25% e 60% da altura; os 20% de cima são fundo calmo (ali entra o título) e os 35% de baixo são superfície ou fundo sem nada importante (ali entram o apresentador e um cartão). Sem texto, sem letras legíveis, sem números, sem logotipos, sem marcas, sem moldura.
