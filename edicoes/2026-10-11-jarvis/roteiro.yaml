# reel7etapas — edição 2026-10-11-jarvis (exemplo: o primeiro reel feito neste modelo)
tema: "Seu próprio JARVIS"
data: "11/10/2026"
palavra: JARVIS
fala: |
  Você sabia que o seu computador já pode trabalhar enquanto você dorme? Já pensou em ter um funcionário dentro do seu computador, trabalhando por você? Tem gente pagando uma fortuna por coisas que você já pode montar em casa. E o melhor: não precisa ser programador! Você pode criar o seu próprio JARVIS. Um ajudante de inteligência artificial que conversa com você, lembra das coisas, pesquisa e executa tarefas. É como ter um funcionário digital só seu, trabalhando do jeito que você ensinar. No inema ponto club tem vídeos, explicações e material para você começar do zero. Comenta JARVIS que eu te mostro o caminho.
# As 7 etapas: cada uma entra na palavra 'ancora' da fala (minúscula, sem acento) e troca imagem, câmera, manchete e destaque.
# camera: push | pull | pan_dir | pan_esq | sobe   ·   foco: [x, y] (0–1) do plano fechado   ·   destaque: cartão à direita do avatar
# 'gatilho' e 'por_que' não aparecem no vídeo: vão para o mapa.jpg (a explicação do modelo).
etapas:
  - id: gancho
    nome: GANCHO
    gatilho: "resultado desejado em 2 segundos"
    por_que: "mostra o sonho (dormir enquanto o PC trabalha) antes de falar de tecnologia"
    capa: {linha1: "VOCÊ DORME.", linha2: "ELE TRABALHA.", sub: "SEU PRÓPRIO JARVIS!"}
    camera: push
    foco: [0.5, 0.62]
    cena: "Quarto à noite. Em primeiro plano, na metade de baixo da imagem, uma escrivaninha com um notebook aberto cuja tela brilha em dourado mostrando janelas de trabalho em andamento. Ao fundo, na cama, uma pessoa adulta dormindo tranquila, bem visível sob uma luz suave de abajur. A pessoa e o notebook nítidos e iluminados."
  - id: desejo
    nome: DESEJO
    gatilho: "ter um funcionário só seu"
    por_que: "a pessoa se imagina com ajuda sem pagar salário"
    ancora: pensou
    linha1: "UM FUNCIONÁRIO"
    linha2: "DENTRO DO PC"
    destaque: {titulo: "24 H", texto: "trabalhando\npor você"}
    camera: pull
    foco: [0.5, 0.5]
    cena: "Monitor de computador numa escrivaninha de home office à noite. Dentro da tela, como se morasse ali, um funcionário em miniatura de camisa social, sentado numa mesinha minúscula, trabalhando concentrado num notebook minúsculo. A luz dourada da tela ilumina o ambiente. Visual divertido e realista."
  - id: medo
    nome: MEDO
    gatilho: "estar gastando à toa"
    por_que: "medo de perder dinheiro prende mais que promessa de ganho"
    ancora: gente
    linha1: "TEM GENTE PAGANDO"
    linha2: "UMA FORTUNA"
    cor: vermelho
    destaque: {titulo: "CARO", texto: "por algo que\nvocê monta\nem casa", cor: vermelho}
    camera: pan_dir
    foco: [0.5, 0.55]
    cena: "Mesa escura com várias cédulas de dinheiro brasileiro (notas de real de 100 e de 50, azuis e laranja) espalhadas, faturas de assinatura dobradas e uma calculadora; a mão de um homem de meia-idade segura as faturas com tensão. Luz lateral dramática, avermelhada e dourada."
  - id: facilidade
    nome: FACILIDADE
    gatilho: "não precisa ser programador"
    por_que: "derruba a objeção que faz a pessoa desistir antes de tentar"
    ancora: melhor
    linha1: "NÃO PRECISA SER"
    linha2: "PROGRAMADOR"
    destaque: {titulo: "SEM CÓDIGO", texto: "do zero,\npasso a passo"}
    camera: push
    foco: [0.5, 0.42]
    cena: "Mulher de uns 45 anos, sorrindo e relaxada no sofá da sala à noite, com o notebook no colo, falando com ele naturalmente como quem conversa com uma pessoa. A tela mostra uma janela de conversa simples, sem código. Abajur com luz dourada quente; rosto bem iluminado."
  - id: descoberta
    nome: DESCOBERTA
    gatilho: "existe um jeito: o seu JARVIS"
    por_que: "dá nome à solução e mostra o que ela faz, em verbos simples"
    ancora: criar
    linha1: "CRIE O SEU"
    linha2: "PRÓPRIO JARVIS"
    destaque: {titulo: "ELE", texto: "conversa\nlembra · pesquisa\nexecuta tarefas"}
    camera: sobe
    foco: [0.5, 0.48]
    cena: "Escrivaninha à noite. Na tela do computador, um assistente pessoal representado por uma esfera de luz dourada suave e calorosa, com pequenos balões de conversa, uma lupa, um calendário e uma caixinha de tarefas flutuando ao redor, como ícones simples. Atmosfera acolhedora. Nada de robô, nada de gráfico de ações."
  - id: beneficio
    nome: BENEFÍCIO
    gatilho: "do jeito que você ensinar"
    por_que: "fecha a imagem do resultado: um ajudante sob medida"
    ancora: como
    linha1: "UM FUNCIONÁRIO"
    linha2: "DIGITAL SÓ SEU"
    destaque: {titulo: "SEU JEITO", texto: "trabalha como\nvocê ensinar"}
    camera: pan_esq
    foco: [0.45, 0.45]
    cena: "Amanhecer em casa. Uma pessoa de roupão, com uma xícara de café, sorri olhando para o notebook, que mostra uma lista de tarefas toda marcada com checks verdes. Luz do sol dourada entrando pela janela. Clima de tranquilidade."
  - id: comentario
    nome: COMENTÁRIO
    gatilho: "tudo no inema.club ou uma palavra para comentar"
    por_que: "dá o caminho (o site) e uma ação pequena e fácil: comentar uma palavra"
    ancora: inema
    linha1: "TUDO NO"
    linha2: "INEMA.CLUB"
    destaque: {titulo: "GRÁTIS", texto: "vídeos, explicações\ne material\ndo zero"}
    camera: push
    foco: [0.5, 0.5]
    cena: "Mão segurando um smartphone na vertical, numa sala escura com bokeh dourado. Na tela do celular, no alto, um vídeo vertical mostrando um computador brilhando em dourado numa mesa à noite; embaixo, a área de comentários com avatares redondos, corações e balões de comentário, sem letras legíveis. Tela bem iluminada."
# CTA (entra na palavra 'ancora' da última etapa). Padrão das próximas falas:
#   "Tá tudo no inema ponto club. Ou comenta <PALAVRA> que eu te mando o link."
cta: {ancora: comenta, linha1: "ou comenta", palavra: "JARVIS", linha2: "que eu te mostro o caminho"}
legenda_envio: "SEU PRÓPRIO JARVIS (v2) — reel no modelo de 7 etapas (gancho → desejo → medo → facilidade → descoberta → benefício → comentário)."
