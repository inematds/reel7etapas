    linha1: "TUDO NO"
    linha2: "INEMA.CLUB"
    painel: {titulo: "INEMA.CLUB", texto: "vídeos + material\npara começar\ndo zero"}
    depois: {ancora: comenta, linha1: "COMENTA", linha2: "JARVIS", painel: {titulo: "COMENTA", texto: "JARVIS", grande: true}}
    cena: "hand holding a smartphone at night, glowing screen, warm golden bokeh city lights in the background"
final: ["COMENTA JARVIS", "INEMA.CLUB", "cursos e material gratuitos"]
