palavra: CLIMA
fala: |
  Um terremoto, dois furacões e uma enchente com mais de três milhões de atingidos. Tudo numa semana só. Imagina saber do perigo antes de ele chegar na sua cidade. Na Flórida, o furacão Isaias deixou quatro mortos e novecentas mil casas sem luz. E no Panamá, a terra tremeu com magnitude sete vírgula sete. E o melhor: o alerta existe e é de graça. Cadastra o seu CEP na Defesa Civil e acompanha a chuva num painel em tempo real. Quem sabe antes, se protege. Tá tudo no inema ponto club. Ou comenta CLIMA que eu te mando o link.
# Fatos: Tailândia 3,13 mi atingidos desde 16/09 (DDPM, 08/10); Isaias 09/10 Destin FL, 4 mortos, ~900 mil clientes sem luz (Weather.com/CBS/NBC, 10–12/10); Panamá M7,7 em 09/10 (AP/Reuters; USGS 7,6), alerta de tsunami em 6 países; Simon cat. 4 (AP, 11/10).
