  - id: comentario
    nome: COMENTÁRIO
    gatilho: "tudo no inema.club ou uma palavra para comentar"
    por_que: "dá o caminho (o site) e uma ação pequena: comentar SITE"
    ancora: inema
    linha1: "TUDO NO"
    linha2: "INEMA.CLUB"
    destaque: {titulo: "GRÁTIS", texto: "método aberto\nem 10 etapas"}
    camera: push
    foco: [0.5, 0.5]
    cena: "Mão segurando um smartphone na vertical numa mesa clara de dia, luz neutra da janela; na tela, no alto, um vídeo vertical mostrando um site com um selo azul de destaque; embaixo, a área de comentários com avatares redondos, corações e balões de comentário, sem letras legíveis. Tela bem iluminada."
cta: {ancora: comenta, linha1: "ou comenta", palavra: "SITE", linha2: "que eu te mando o link"}
