tema: "3 milhões atingidos pela água na Tailândia"
data: "12/10/2026"
palavra: CLIMA
fala: |
  Três milhões de pessoas atingidas pela água, e a chuva não para há quase um mês. Imagina saber com dias de antecedência que a água vai chegar na sua rua. Na Tailândia, desde dezesseis de setembro, já são quarenta e quatro mortos e mais de um milhão de casas atingidas. E o melhor: você não precisa ser meteorologista para se proteger. Os alertas e os dados de chuva são abertos: cadastra o seu CEP na Defesa Civil e acompanha um painel de chuva em tempo real. Assim você sai antes, e não depois. Tá tudo no inema ponto club. Ou comenta CLIMA que eu te mando o link.
# Fatos: DDPM da Tailândia via Malay Mail (08/10/2026) e AFP: 44 mortos, 3,13 milhões de afetados em 21 províncias + Bangkok, >1,14 milhão de domicílios, chuva desde 16/09.
