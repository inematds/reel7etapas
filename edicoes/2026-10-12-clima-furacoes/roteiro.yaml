tema: "Furacão que ganhou 177 km/h em um dia"
data: "12/10/2026"
palavra: CLIMA
fala: |
  Um furacão ganhou cento e setenta e sete quilômetros por hora de vento em um único dia. Imagina ter um dia inteiro de aviso, em vez de uma hora. Em três semanas, o Polo virou categoria cinco no Pacífico, o Simon assustou a costa do México, e o Isaias deixou quatro mortos e mais de novecentos mil sem luz nos Estados Unidos. E o melhor: o mar quente que alimenta isso é medido todo dia por satélite, e os dados são abertos. Cadastra o seu CEP na Defesa Civil para receber os alertas. Quem sabe antes se prepara. Tá tudo no inema ponto club. Ou comenta CLIMA que eu te mando o link.
# Fatos: Polo Cat. 5 em 22/09, +110 mph (177 km/h) em 24 h (AP via KPTV, Mexico News Daily); Simon Cat. 4 em 10/10, olho rente a Jalisco, ~5 mil evacuados (AP), pouso não confirmado; Isaias pouso Cat. 2 em Destin (FL) em 10/10, ≥4 mortos e >900 mil clientes sem energia (NBC/CNN).
