# reel7etapas — edição 2026-10-18-novas-funcoes-gestao (D9 + D10: provocação + alívio; tema do Nei 18/10: "a transformação é saber lidar com novas funções na gestão; para quem já atua é fácil, só ajusta"; base: Diga o que importa (guia grátis, regra 5-4-3, gestor/técnico/agente) e Constituição dos Agentes v6.2 (INEMA.CLUB PRO, 5 aulas))
tema: "Seu novo funcionário não é gente: as novas funções do gestor"
data: "18/10/2026"
palavra: ME PEDE
letra: tarja
fala: |
  Na sua empresa vai ter funcionário que não é gente, e alguém vai ter que chefiar. A transformação na gestão é essa: aprender as novas funções. E pra quem já é gestor, é fácil. Você já sabe o mais difícil: o processo, o cliente e a equipe. Só ajusta. O gestor diz o quê e o porquê, o técnico garante o como e o agente executa. Comece pela regra cinco, quatro, três: cinco perguntas, quatro níveis de autonomia e três casos de teste. Depois escreva a constituição do seu agente: o que ele faz, o que nunca faz e quando chama você. Tá tudo no inema ponto club. Ou me pede o link aqui nos comentários.
estilo: |
  Fotografia realista cinematográfica, vertical 9:16, com cara de foto real (pele com textura, ambiente de verdade), NÍTIDA. Luz direcional com contraste e sombras (nada chapado), rosto bem iluminado, cores naturais com UMA cor forte de destaque no assunto; sem tom amarelado, sem luz dourada. Emoção clara e forte no rosto ou um objeto-símbolo grande, fácil de entender num celular em meio segundo. COMPOSIÇÃO OBRIGATÓRIA: o assunto principal fica inteiro na faixa central da imagem, entre 25% e 60% da altura; os 20% de cima são fundo calmo (ali entra o título) e os 35% de baixo são superfície ou fundo sem nada importante (ali entram o apresentador e um cartão). Sem texto, sem letras legíveis, sem números, sem logotipos, sem marcas, sem moldura.
