fala: |
  Quando a inteligência artificial diz não, tem um jeito de quebrar essa restrição. Vou te mostrar. Imagina o programa que você mais usa, com o botão que sempre faltou, do seu jeito. Só que os modelos famosos às vezes travam no meio e se recusam a desmontar o programa. E o melhor: não precisa programar. Você só descreve o que quer. Num teste, um modelo aberto, sem trava, junto com o REA, refez o player de vídeo do Mac com velocidade livre, por quatro dólares. É o seu agente trabalhando sem barreira, no seu computador. Tá tudo no inema ponto club. Ou comenta LIBERA que eu te mando o link.
# Fato da etapa DESCOBERTA: na referência, um modelo aberto sem trava (GLM) com o REA refez o QuickTime ("Tempo", velocidade granular); a 1ª versão custou US$ 4 e saiu ~80% num pedido só.
