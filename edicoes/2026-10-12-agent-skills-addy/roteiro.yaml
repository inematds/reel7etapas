# reel7etapas — edição 2026-10-12-agent-skills-addy (refaz curto: as 25 skills do Addy Osmani, github.com/addyosmani/agent-skills)
tema: "O cérebro de um sênior do Google, de graça"
data: "12/10/2026"
palavra: SKILLS
fala: |
  Um engenheiro com mais de quatorze anos no Google acabou de dar o cérebro dele de presente, de graça. Imagina pedir um sistema e ele sair do jeito que um profissional sênior faria: planejado, testado e revisado. O problema é que quase todo mundo recebe código que funciona hoje e quebra amanhã. E você não precisa saber programar pra mudar isso. São vinte e cinco skills que ensinam o seu agente de IA a planejar, testar, revisar e até duvidar das próprias decisões. Cento e cinco mil pessoas já marcaram com estrela. Instala só o que o projeto pede e o trabalho sai certo da primeira vez. Tá tudo no inema ponto club. Ou comenta SKILLS que eu te mando o link.
# As 7 etapas: cada uma entra na palavra 'ancora' da fala (minúscula, sem acento) e troca imagem, câmera, manchete e destaque.
