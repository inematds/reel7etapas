# reel7etapas — edição 2026-10-12-r7e-como-funciona (o próprio r7e: ideia vira vídeo viral, em escala)
tema: "Faça vídeos virais direto, em escala"
data: "12/10/2026"
palavra: VIRAL
fala: |
  Você manda uma ideia e recebe um vídeo viral pronto, e dá pra fazer isso em escala. Imagina publicar vídeo todo dia no seu canal, sem travar na edição. Tem gente gastando horas, ou pagando editor caro, por cada vídeo curto. E o melhor: o projeto é aberto e de graça, qualquer um pode usar. Ele se chama reel sete etapas: um modelo com sete gatilhos, do gancho ao comentário. O agente escreve o roteiro, gera as imagens, coloca o avatar e confere tudo antes de publicar. Em dois dias, saíram dez vídeos com ele. Tá tudo no inema ponto club. Ou comenta VIRAL que eu te mando o link.
# Prova da etapa BENEFÍCIO: 10 edições com youtube_ no roteiro.yaml, publicadas em 11 e 12/10/2026 (grep -l youtube_2026 edicoes/*/roteiro.yaml).
