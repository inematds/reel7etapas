fala: |
  A trapaça nos jogos online acabou de mudar de nível. Um criador famoso testou num jogo competitivo e mostrou o que dá pra fazer: tanque com o teto transparente, inimigo visto através da parede, minimapa onde o jogo não tem. Pra quem joga limpo, é perder sem saber por quê. E não foi um programa de trapaça comprado: a inteligência artificial entendeu o jogo por dentro, sem o código. O nome disso é REA, engenharia reversa de qualquer programa. Ele fez só como experimento e apagou tudo. Mas as empresas de jogos vão ter que correr atrás. Tá tudo no inema ponto club. Quer o link? Me pede aqui nos comentários.
