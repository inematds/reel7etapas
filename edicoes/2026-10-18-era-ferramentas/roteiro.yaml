# reel7etapas — edição 2026-10-18-era-ferramentas (D9 + D10: provocação; tema do Nei 18/10: "a era das ferramentas acabou, se não souber pedir perdeu")
tema: "A era das ferramentas acabou: quem não souber pedir perdeu"
data: "18/10/2026"
palavra: ME PEDE
letra: tarja
fala: |
  A era das ferramentas acabou. Quem ainda corre atrás do aplicativo novo está sendo superficial. O código de quase tudo já está no GitHub, de graça, e o Claude e o Codex fazem o que você pedir. Mas se não souber pedir, perdeu: enquanto você testa o aplicativo da semana, outro já mandou o agente fazer o trabalho inteiro. E pedir bem se aprende rápido, não precisa ser programador. São três coisas: o que você quer, o contexto e como conferir. Quem sabe pedir usa qualquer ferramenta, até a que nem saiu ainda. Tá tudo no inema ponto club. Ou me pede o link aqui nos comentários.
estilo: |
  Fotografia realista cinematográfica, vertical 9:16, com cara de foto real (pele com textura, ambiente de verdade), NÍTIDA. Luz direcional com contraste e sombras (nada chapado), rosto bem iluminado, cores naturais com UMA cor forte de destaque no assunto; sem tom amarelado, sem luz dourada. Emoção clara e forte no rosto ou um objeto-símbolo grande, fácil de entender num celular em meio segundo. COMPOSIÇÃO OBRIGATÓRIA: o assunto principal fica inteiro na faixa central da imagem, entre 25% e 60% da altura; os 20% de cima são fundo calmo (ali entra o título) e os 35% de baixo são superfície ou fundo sem nada importante (ali entram o apresentador e um cartão). Sem texto, sem letras legíveis, sem números, sem logotipos, sem marcas, sem moldura.
