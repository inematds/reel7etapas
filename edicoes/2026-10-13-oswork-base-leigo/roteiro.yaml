# reel7etapas — edição 2026-10-13-oswork-base-leigo (OSWork = a base para quem não é da área criar qualquer sistema de agentes)
tema: "OSWork: a base para quem não sabe nada"
data: "13/10/2026"
palavra: OSWORK
fala: |
  Mesmo sem saber nada de computador, você pode montar um sistema que trabalha por você. Já pensou criar os seus próprios ajudantes, do jeito do seu negócio? Tem muita gente travada, achando que isso é só pra programador. E o melhor: você começa do zero, na tela preta do Windows, um passo de cada vez. No OSWork você aprende a criar pastas, chamar o agente e guardar o seu projeto na internet. Com essa base, qualquer sistema de agentes vira só mais um projeto. Você deixa de depender dos outros. Tá tudo no inema ponto club. Ou comenta OSWORK que eu te mando o link.
# Fatos: OSWork (eventos.inema.pro/oswork, oswork-quick, oswork-v62): cmd no Windows → pasta projetos\<projeto> → Explorador →
# Claude Code/Codex na pasta → git + gh + SSH → GitHub/Pages → depois VPS Linux. Gratuito no INEMA.CLUB.
