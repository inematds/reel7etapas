fala: |
  O novo carro da Tesla voa, e isso não é inteligência artificial. Imagina um carro que chega a cem quilômetros por hora em menos de um segundo. Só que é caro: a estimativa é de quatrocentos a seiscentos mil dólares, e a produção só começa em dois mil e vinte e oito. Mas entender como ele funciona é simples, não precisa ser engenheiro. São dez propulsores de ar comprimido e uma lei de Newton: ação e reação. O ar sai com força para um lado, e o carro vai para o outro. Quatro empurram para a frente, quatro fazem voar e dois controlam o giro. Agora você explica como um carro voa. Tá tudo no inema ponto club. Quer o link? Me pede aqui nos comentários.
