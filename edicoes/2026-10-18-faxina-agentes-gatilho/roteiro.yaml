# reel7etapas — edição 2026-10-18-faxina-agentes (divulga o guia + vídeo "Faxina no setup do Claude e do Codex", repo inematds/faxina-agentes)
tema: "Faxina no setup do Claude e do Codex: o agente obedece e gasta menos"
data: "18/10/2026"
palavra: FAXINA
fala: |
  Seu agente ignora as regras e queima o seu limite? O problema não é o modelo. Imagina o seu agente obedecendo de primeira e gastando bem menos tokens. Hoje ele recebe três arquivos de instrução, skills de tutorial e memória velha antes da primeira palavra, e cada erro custa horas. E você não precisa reinstalar nada: um prompt faz a auditoria. O nome disso é faxina do setup. Um AGENTS.md só, uma pasta por projeto e playbooks com o seu jeito de trabalhar. Agora o seu agente trabalha leve e obedece. Tá tudo no inema ponto club. Quer o link? Comenta FAXINA aqui embaixo.
