# reel7etapas — edição 2026-10-18-faturar-2027 (D9 + D10: provocação + oportunidade; tema do Nei 18/10: "quem vai faturar em 2027 é quem ajuda os outros a criar")
tema: "Quem vai faturar em 2027 é quem ajuda os outros a criar com IA"
data: "18/10/2026"
palavra: ME PEDE
letra: tarja
fala: |
  Quem vai faturar em dois mil e vinte e sete não é quem cria software. É quem ajuda os outros a criar. Acorda! As empresas estão perdidas no meio de tanta opção de inteligência artificial, e vão pagar quem mostrar o caminho. Isso já aconteceu com a internet nos anos noventa, com os sites nos anos dois mil e com o celular em dois mil e dez. Sempre faturou quem ensinou. Seja consultor, auditor ou treinador de IA. Eu montei kits pra você aprender rápido e começar a atender. Aprende agora, enquanto ainda dá tempo de chegar primeiro. Tá tudo no inema ponto club. Ou me pede o link aqui nos comentários.
estilo: |
  Fotografia realista cinematográfica, vertical 9:16, com cara de foto real (pele com textura, ambiente de verdade), NÍTIDA. Luz direcional com contraste e sombras (nada chapado), rosto bem iluminado, cores naturais com UMA cor forte de destaque no assunto; sem tom amarelado, sem luz dourada. Emoção clara e forte no rosto ou um objeto-símbolo grande, fácil de entender num celular em meio segundo. COMPOSIÇÃO OBRIGATÓRIA: o assunto principal fica inteiro na faixa central da imagem, entre 25% e 60% da altura; os 20% de cima são fundo calmo (ali entra o título) e os 35% de baixo são superfície ou fundo sem nada importante (ali entram o apresentador e um cartão). Sem texto, sem letras legíveis, sem números, sem logotipos, sem marcas, sem moldura.
