palavra: COMENTA
fala: |
  Clonar um programa com inteligência artificial é crime? Nos Estados Unidos, quem defende diz que não, desde que ninguém copie o código. Funciona assim: um time descreve só o que o programa faz, e outro time constrói do zero, sem ver nada do original. Isso se chama sala limpa, e é usado há décadas. Mas as empresas vão brigar na justiça, e os processos devem começar logo. Agora, com o REA, a engenharia reversa com IA, qualquer pessoa consegue fazer isso. E aqui no Brasil, como vai ser? Você acha certo ou errado clonar um programa? Comenta aqui. E o guia tá no inema ponto club.
