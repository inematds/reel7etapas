    destaque: {titulo: "GRÁTIS", texto: "sistemas,\nguias e cursos\nde vídeo"}
    camera: push
    foco: [0.5, 0.5]
    cena: "Mão segurando um smartphone na vertical, numa sala clara e iluminada de dia com bokeh dourado e luminoso ao fundo. Na tela do celular, no alto, um vídeo vertical mostrando uma claquete de cinema dourada brilhando; embaixo, a área de comentários com avatares redondos, corações e balões de comentário, sem letras legíveis. Imagem clara e luminosa."
