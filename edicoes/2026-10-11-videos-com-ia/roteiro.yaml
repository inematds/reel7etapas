# reel7etapas — edição 2026-10-11-videos-com-ia (área Vídeos com IA: https://eventos.inema.pro/videos/)
tema: "Crie vídeo automático com uma frase"
data: "11/10/2026"
palavra: VÍDEO
fala: |
  Crie vídeo automático com uma frase. Imagina ter vídeo novo no seu canal toda semana, ou até todo dia. Hoje todo mundo edita no PC ou no celular, mas dá trabalho, toma horas, e programa bom de edição custa caro. E você não precisa saber editar nem aparecer na câmera. O INEMA juntou todos os sistemas de vídeo num lugar só: explicativo com avatar, documentário, reel, filme a partir de fotos, anúncio e até clipe de música. Você escreve uma frase, e o sistema faz o roteiro, a voz, a montagem e publica. Simples, em escala, com projetos abertos e gratuitos. Tá tudo no inema ponto club. Ou comenta VÍDEO que eu te mando o link.
# As 7 etapas: cada uma entra na palavra 'ancora' da fala (minúscula, sem acento) e troca imagem, câmera, manchete e destaque.
# camera: push | pull | pan_dir | pan_esq | sobe   ·   foco: [x, y] (0–1) do plano fechado   ·   destaque: cartão à direita do avatar
# 'gatilho' e 'por_que' não aparecem no vídeo: vão para o mapa.jpg (a explicação do modelo).
etapas:
  - id: gancho
    nome: GANCHO
    gatilho: "resultado em 2 segundos: uma frase vira vídeo"
    por_que: "mostra o resultado e o esforço mínimo (uma frase) antes de qualquer tecnologia"
    capa: {linha1: "CRIE VÍDEO", linha2: "AUTOMÁTICO", sub: "COM UMA FRASE"}
    camera: push
    foco: [0.5, 0.55]
    cena: "Escrivaninha em casa à noite. Uma pessoa adulta digita uma frase curta num notebook aberto; ao lado, apoiado num suporte, um celular na vertical mostra um vídeo pronto, colorido, com botão de play. A tela do notebook e o celular brilham em dourado, iluminando as mãos e o rosto da pessoa. Pessoa, notebook e celular nítidos no centro da imagem."
  - id: desejo
    nome: DESEJO
    gatilho: "ter um canal que não para"
    por_que: "a pessoa se imagina com vídeo novo saindo sempre, sem esforço"
    ancora: imagina
    linha1: "VÍDEO NOVO"
    linha2: "TODO DIA"
    destaque: {titulo: "SEMPRE", texto: "toda semana\nou todo dia"}
    camera: pan_dir
    foco: [0.5, 0.5]
    cena: "Mão segurando um smartphone na vertical numa sala aconchegante com bokeh dourado. Na tela, um canal de vídeos com uma grade de miniaturas novas e coloridas e várias notificações de vídeo publicado, sem letras legíveis. Tela bem iluminada no centro da imagem."
  - id: medo
    nome: MEDO
    gatilho: "editar sozinho cansa e software bom é caro"
    por_que: "a dor real de hoje: todo mundo edita, mas perde horas e paga programa"
    ancora: hoje
    linha1: "EDITAR DÁ TRABALHO"
    linha2: "PROGRAMA BOM CUSTA"
    cor: vermelho
    destaque: {titulo: "HORAS", texto: "por vídeo,\nmais a assinatura\ndo programa", cor: vermelho}
    camera: sobe
    foco: [0.5, 0.5]
    cena: "Pessoa de uns 40 anos, cansada, com a mão na testa, editando um vídeo num escritório de casa bem iluminado à tarde: no monitor grande uma linha do tempo de edição longa e cheia de faixas coloridas, e na outra mão um celular também com um app de edição aberto. Várias xícaras de café vazias na mesa. Luz clara de janela no rosto, tons quentes avermelhados e dourados, imagem clara."
