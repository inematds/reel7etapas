# reel7etapas — edição 2026-10-18-saas-morrendo (D9 + D10: medo + dica; tema do Nei 18/10: "SaaS está morrendo e tem gente focando nisso; foca em 2027 no formato novo")
tema: "O SaaS está morrendo e tem gente apostando tudo nele"
data: "18/10/2026"
palavra: ME PEDE
letra: tarja
fala: |
  O software que você assina todo mês está morrendo, e tem gente apostando tudo nele agora. O programa que você pagava por assinatura, a inteligência artificial refaz sob medida num fim de semana. E quem fica no formato velho quebra junto. Eu já passei por isso várias vezes, e foi sempre igual. Então te dou a dica: em dois mil e vinte e sete, foca no formato novo, ajudar empresas a usar a IA do jeito delas. Eu criei a formação Profissional dois mil e trinta pra isso, e ela está de graça. Tá tudo no inema ponto club. Ou me pede o link aqui nos comentários.
estilo: |
  Fotografia realista cinematográfica, vertical 9:16, com cara de foto real (pele com textura, ambiente de verdade), NÍTIDA. Luz direcional com contraste e sombras (nada chapado), rosto bem iluminado, cores naturais com UMA cor forte de destaque no assunto; sem tom amarelado, sem luz dourada. Emoção clara e forte no rosto ou um objeto-símbolo grande, fácil de entender num celular em meio segundo. COMPOSIÇÃO OBRIGATÓRIA: o assunto principal fica inteiro na faixa central da imagem, entre 25% e 60% da altura; os 20% de cima são fundo calmo (ali entra o título) e os 35% de baixo são superfície ou fundo sem nada importante (ali entram o apresentador e um cartão). Sem texto, sem letras legíveis, sem números, sem logotipos, sem marcas, sem moldura.
