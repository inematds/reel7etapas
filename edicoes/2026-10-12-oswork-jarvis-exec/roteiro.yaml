legenda_envio: ANTES DO SEU JARVIS, APRENDA O OSWORK — versão executiva (mesma fala, imagens corporativas). Curso grátis no inema.club.
canal: lives1
estilo: 'Fotografia corporativa realista e sóbria, como capa de revista de negócios, vertical 9:16. Escritório executivo moderno e CLARO de dia, luz natural de janela; tons neutros (cinza, azul-marinho,
  grafite, madeira escura) com toques discretos de dourado. Pessoas de terno ou blazer, expressões sérias e confiantes, postura profissional. COMPOSIÇÃO OBRIGATÓRIA: o assunto principal (rostos, mãos, tela,
  objeto-chave) fica inteiro na faixa central, entre 30% e 60% da altura; os 20% de cima são fundo calmo (parede, teto, vidro) porque ali entra o título, e os 40% de baixo são mesa ou fundo sem nada importante.
  Sem texto, sem letras legíveis, sem números, sem logotipos, sem marcas, sem robôs, sem visual de ficção científica, nada caricato.'
