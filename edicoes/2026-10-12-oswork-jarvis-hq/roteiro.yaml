estilo: 'Ilustração estilo história em quadrinhos (HQ) pop art, traço preto forte, retícula de pontos, cores vivas e chapadas (amarelo, azul, vermelho), vertical 9:16, cenário claro. COMPOSIÇÃO OBRIGATÓRIA:
  o assunto principal fica no LADO DIREITO da imagem, entre 30% e 60% da altura; o lado esquerdo e os 35% de baixo são fundo simples de retícula, sem nada importante. Sem balões de fala, sem texto, sem
  letras, sem onomatopeias, sem logotipos.'
