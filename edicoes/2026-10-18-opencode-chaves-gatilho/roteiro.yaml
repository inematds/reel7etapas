# reel7etapas — edição 2026-10-18-opencode-chaves (viral: ataque ao OpenCode roubou chaves; como eu protejo as minhas)
tema: "Hackers roubaram chaves no OpenCode: como eu protejo as minhas"
data: "18/10/2026"
palavra: ME PEDE
fala: |
  Hackers invadiram o OpenCode e roubaram as chaves de acesso de milhares de pessoas. Mas dá pra dormir tranquilo. Imagina saber que, mesmo se roubarem a sua chave, o prejuízo tem teto. Teve gente que acordou com mil e setecentos dólares de conta numa noite só. E você não precisa ser especialista em segurança. Eu faço três coisas: coloco limite de gasto em cada chave, crio uma chave por assunto e tenho um monitor que acompanha meus gastos com IA e toca o alarme quando foge do normal. Roubaram uma? Eu revogo só aquela e o resto segue funcionando. Tá tudo no inema ponto club. Quer o link? Me pede aqui nos comentários.
