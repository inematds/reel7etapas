fala: |
  Hackers invadiram o OpenCode e roubaram as chaves de acesso de milhares de pessoas. Teve gente que acordou com mil e setecentos dólares de conta numa noite só. A chave é a senha que a IA usa pra cobrar de você, e a sua pode ser a próxima. Imagina dormir sabendo que, mesmo se roubarem, o prejuízo tem teto. Você não precisa ser especialista, nem programador. São três ajustes: limite de gasto em cada chave, uma chave pra cada uso e um alarme que avisa quando o gasto foge do normal. Roubaram uma? Você cancela só aquela, e o resto segue funcionando. O susto vira um aviso no celular, não uma conta de mil dólares. Tá tudo no inema ponto club. Ou me pede o link aqui nos comentários.
