fala: |
  Dois meses seguidos acima do grau e meio que o Acordo de Paris tenta evitar. Imagina saber como vai ser o próximo verão antes de todo mundo. O Copernicus mediu: este foi o segundo setembro mais quente da história, e os oceanos bateram recorde. E o El Niño tem oitenta e três por cento de chance de ser o mais forte desde mil novecentos e cinquenta. E o melhor: dá pra acompanhar tudo isso de graça, com dados oficiais. Painel de chuva, alerta no CEP e previsão de quinze dias. Você se prepara antes do calor e da chuva. Tá tudo no inema ponto club. Ou comenta CLIMA que eu te mando o link.
# Fatos: Copernicus C3S (12/10/2026): setembro +1,63 °C sobre o pré-industrial, 2º setembro mais quente, oceanos com recorde para o mês; agosto +1,65 °C, empatado como mês mais quente. NOAA CPC (08/10/2026): 83% de chance de El Niño histórico em out–dez.
