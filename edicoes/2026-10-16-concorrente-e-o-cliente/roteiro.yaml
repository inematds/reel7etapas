fala: |
  O maior concorrente dos programas por assinatura vai ser quem usava eles. O contador que conhece cada tela do sistema. A dentista que sabe tudo o que falta na agenda. Pra empresa de software, é o pior cenário: o cliente sabe exatamente o que presta e o que sobra. E ele não precisa saber programar: descreve em português e a inteligência artificial escreve o código. Junta isso com o REA, a engenharia reversa que entende como o programa original funciona, e nasce um concorrente. Feito por quem vive o problema todo dia, mais simples e mais barato. Tá tudo no inema ponto club. Quer o link? Me pede aqui nos comentários.
