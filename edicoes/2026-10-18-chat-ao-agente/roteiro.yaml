# reel7etapas — edição 2026-10-18-chat-ao-agente (D9 + D10: medo de ficar para trás + urgência; tema do Nei 18/10: "sai na frente: do chat ao agente, grátis antes de ficar só no PRO")
tema: "Sai na frente: do chat ao agente que produz pra você"
data: "18/10/2026"
palavra: ME PEDE
letra: tarja
fala: |
  Sai na frente dos outros. Não é parar de usar o chat, é fazer os agentes produzirem pra você. No chat, você pergunta, copia e cola. No terminal, o agente abre os seus arquivos, executa e entrega pronto. Quem ficar só no chat vai ver o colega entregar antes, todo dia. Por isso eu criei o curso Do chat ao agente, um passo a passo do zero. Ele está grátis agora, aproveita antes de ficar só no PRO. Tá tudo no inema ponto club. Ou me pede o link aqui nos comentários.
estilo: |
  Fotografia realista cinematográfica, vertical 9:16, com cara de foto real (pele com textura, ambiente de verdade), NÍTIDA. Luz direcional com contraste e sombras (nada chapado), rosto bem iluminado, cores naturais com UMA cor forte de destaque no assunto; sem tom amarelado, sem luz dourada. Emoção clara e forte no rosto ou um objeto-símbolo grande, fácil de entender num celular em meio segundo. COMPOSIÇÃO OBRIGATÓRIA: o assunto principal fica inteiro na faixa central da imagem, entre 25% e 60% da altura; os 20% de cima são fundo calmo (ali entra o título) e os 35% de baixo são superfície ou fundo sem nada importante (ali entram o apresentador e um cartão). Sem texto, sem letras legíveis, sem números, sem logotipos, sem marcas, sem moldura.
etapas:
  - id: gancho
    nome: PROVOCAÇÃO
    gatilho: "você ainda copia e cola do chat?"
    por_que: "todo mundo que usa ChatGPT se reconhece no copia e cola"
    capa: {linha1: "VOCÊ AINDA", linha2: "COPIA E COLA?", cor2: vermelho, desfoque: 0, titulo_pos: baixo}
    camera: push
    foco: [0.5, 0.22]
    cena: "Mulher de uns 35 anos de madrugada num escritório escuro, exausta, cercada de post-its colados por todo lado, copiando e colando entre duas janelas no notebook; a luz fria da tela no rosto cansado e uma pilha alta de papéis de tarefas ao lado."
    cor_livre: true
    luz_min: 0
    estilo: "Fotografia realista de impacto, cara de foto jornalística ou cena de cinema, vertical 9:16, NÍTIDA. Contraste alto e luz dramática direcional, sombras profundas. Emoção forte e clara (exaustão, frustração). COMPOSIÇÃO OBRIGATÓRIA: o assunto principal inteiro no TERÇO DE CIMA da imagem, entre 8% e 34% da altura, grande e centralizado; de 36% para baixo, só fundo escuro simples e liso, sem nada importante (ali entram a manchete e o apresentador). Sem texto, sem letras legíveis, sem dígitos legíveis, sem logotipos, sem marcas, sem moldura."
