# reel7etapas — edição 2026-10-12-rea-servidor (refaz provocativo de Vkcm5k7BtXw: o REA lê o app, não o servidor)
tema: "O REA lê o app do seu banco, mas não o servidor"
data: "12/10/2026"
palavra: SERVIDOR
fala: |
  O REA consegue ler o aplicativo do seu banco. E mesmo assim não tira um centavo da sua conta. Imagina entender como qualquer aplicativo funciona por dentro. Tem gente com medo, achando que acabou o segredo de tudo. E o melhor: o que roda no servidor ele não alcança. Saldo, senha e transferência são decididos lá. O REA é uma ferramenta aberta que desmonta o que está no seu aparelho e mostra a prova. Quem deixa chave e regra dentro do app se expõe. Quem põe no servidor dorme tranquilo. Tá tudo no inema ponto club. Ou comenta SERVIDOR que eu te mando o link.
# Fatos: README do morluto/rea 6.4.0 (alvos: binários, JavaScript/Electron, sites, capturas de rede, APK, firmware — tudo local, no aparelho);
# o código do servidor não é entregue ao cliente. Ideia central do vídeo-fonte: "lê o app do banco, não mexe no banco".
